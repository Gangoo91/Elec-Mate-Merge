# Correctness checks
#
# The repo already had eight `check:*:ci` scripts and no job that ran any of
# them, so every guard was advisory — it caught a problem only if someone
# happened to run it. That is how the R2 column, the NaN in a user-facing
# warning, and seven silently-discarded gate warnings all shipped and survived
# for months.
#
# Everything that passes today is enforced. Only key-integrity is advisory, and
# only because it is currently red (see its step). Promote it the moment it is
# green — a permanently-yellow step is one nobody reads.
name: Correctness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Certificate & content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # Enforced. Every assertion here corresponds to a defect that reached
      # production — see the header of the script.
      - name: EICR correctness
        run: npm run check:eicr:ci

      # Green as of 7 Aug 2026, so enforced from the start.
      - name: Certificate field mapping
        run: npm run check:cert-mapping:ci

      - name: Question quality
        run: npm run check:question-quality:ci

      # Green from the start, so enforced. Guards the 65 calculator -> client
      # PDF reports: coverage, ungrounded standards (a report cited a BS 7671
      # regulation that does not exist), duplicate titles, and headline
      # restatement. tsc and eslint are clean on every one of those faults.
      - name: Calculator report contract
        run: npm run check:calc-reports

      # Green from the start, so enforced. ELE-1747: the mobile test grid showed
      # each column's input prompt as its value, so an untouched schedule of
      # test results displayed `>200` insulation, `✓` polarity and `0.00` Zs and
      # printed N/A. A styling sweep that removed grey text is what made the
      # prompt indistinguishable from a reading, and neither tsc nor eslint has
      # anything to say about that.
      - name: Test grid shows no prompt as a reading
        run: npm run check:test-placeholders

      # Green from the start, so enforced. ELE-1750: a Minor Works certificate
      # could not be generated, previewed or emailed because a bare
      # `await import()` in the formatter asked for a chunk hash that a deploy
      # had replaced. Every deploy does this to whoever has the app open at the
      # time, and neither tsc nor eslint sees it — the code is valid and works
      # on every machine where the chunk still exists.
      - name: Certificate dynamic imports are retried
        run: npm run check:cert-imports

      # Green from the start, so enforced. The Room Planner draws symbols from a
      # generated inline map while the public chart draws the .svg files; if the
      # two drift, a corrected symbol reaches one surface and not the other —
      # which is how the planner came to draw a plain circle for a socket outlet.
      - name: Room Planner symbols match public/symbols
        run: npm run check:symbol-svgs

      # Green from the start, so enforced. ELE-1754: fire alarm study content
      # taught figures that contradict BS 5839-1:2025 — an 84 m² detector
      # coverage area that does not exist in the standard, a "test 25% of
      # detectors annually over 4 years" cycle that does not exist either, and
      # Clause 45 (Extensions) cited for every service interval. BS 5839-1 is
      # NOT in the RAG, so nothing in the build could tell a real recommendation
      # from a plausible invention, and several of the wrong figures were
      # internally consistent. Verified against the purchased standard.
      - name: Fire alarm facts match BS 5839-1:2025
        run: npm run check:fire-alarm-facts

      # Green from the start, so enforced. BS 5839-1:2025 shares the
      # bs7671_facets corpus with BS 7671/GN3/OSG, and which book wins a query
      # is decided solely by whether the query-understanding layer tags it
      # `fire`. The original vocabulary held 'smoke detection', which does not
      # substring-match "smoke detectors" — so the commonest fire alarm
      # question of all routed to the Wiring Regs instead.
      - name: Fire alarm questions route to BS 5839-1
        run: npm run check:fire-alarm-routing

      # Green from the start, so enforced. ELE-1754 second pass: the 46-page
      # fire alarm course makes ~790 BS 5839-1 clause citations, and until the
      # standard was ingested nothing could check them. Four named clauses that
      # do not exist — 13.2.1, 13.2.7, 13.2.1.f and 22.5 — and a learner cannot
      # tell an invented clause number from a real one.
      - name: Fire alarm course cites real BS 5839-1 clauses
        run: npm run check:fire-alarm-citations

      # Green from the start, so enforced. BS 5839-1:2025 is a CODE OF PRACTICE:
      # it uses "should" 923 times and "shall" zero times. That property catches
      # fabricated quotes the citation guard cannot see, because the clause
      # NUMBER in those blocks was always real — it was the quoted words that
      # were invented. Five such blocks were found in the course, including an
      # entire compensating-measures regime attributed to 44.2.4 (one sentence)
      # and an MCP/staging rule that said close to the reverse of 18.2.6.
      - name: Quoted BS 5839-1 text does not use "shall"
        run: npm run check:fire-alarm-quotes

      # Green from the start, so enforced. Annex G lets a certificate use any
      # layout "provided that, as a minimum, the information and statements of
      # conformity within the model certificates are present" — and none of the
      # five carried them: no competent-person attribution, no "to the best of
      # my/our knowledge and belief", the whole standard cited instead of the
      # applicable Section/Clause, and no extent-of-liability limitation.
      #
      # Worse than the omissions were three claims Annex G does NOT make, each
      # certifying more than the signatory can know — G7 had a modifier
      # declaring "the entire system remains compliant and functional".
      #
      # The declaration is written twice, in the tab component and in the
      # PDFMonkey template, with nothing joining them; G6's two halves had
      # already drifted apart and neither was Annex G. CI can only reach the
      # repo half, so that is what this holds still.
      - name: Fire alarm certificates carry the Annex G statements of conformity
        run: npm run check:fire-alarm-declarations

      # Green from the start, so enforced. The course makes ~840 BS 5839-1
      # citations and they are all real clause numbers — but fourteen top-level
      # clauses were never cited anywhere, and thirteen of those were topics the
      # course teaches at length. M5S5 is four hundred lines on commissioning
      # that cited 14.17, 29.6 and 30 and never Clause 37, "Commissioning".
      # Module 1 is four sections on system categories that never cited Clause 4,
      # "Categories of system" — two of them miscited it as clause 5, which is
      # "Exchange of information and definition of responsibilities".
      #
      # That is what content written from memory looks like after piecemeal
      # correction: the citations someone thought to check became right, and the
      # obvious one — the clause the section is ABOUT — stayed missing. A learner
      # cannot look up what is never cited.
      - name: Fire alarm sections cite their governing clause
        run: npm run check:fire-alarm-governing-clauses

      # Green from the start, so enforced. learning.tsx renders `meaning`,
      # `plainEnglish`, `onSite` and friends as React children, and React does
      # not decode HTML entities in a JavaScript string. So `meaning="Clause
      # 36.1&rsquo;s NOTE…"` puts the literal characters &rsquo; on the page.
      # Four were live: two in M5S4 and three in M3S6 that rendered every mention
      # of the O&M manual as "O&amp;M".
      #
      # Nothing in the toolchain sees it — valid TS, valid JSX, well-formed
      # string literal, and `vite build` runs no tsc anyway. It is visible only
      # by rendering the page and reading it.
      - name: Fire alarm course has no HTML entities in rendered string props
        run: npm run check:fire-alarm-entities

      # Green from the start, so enforced. ELE-1703: a CIS reverse-charge sale
      # carries zero VAT, so it took the same branch as a genuinely
      # out-of-scope supply and posted to Xero as "No VAT" — under-reporting
      # the org's box 6 outputs in a customer's own VAT return, where we would
      # never see it. The correct TaxType is per-organisation and has to be
      # read from their /TaxRates, so the guard is on the PICKER: it must take
      # the income-side rate, never the expense one (which would claim VAT back
      # rather than report it) and never an archived rate.
      #
      # Scoped to this one file deliberately. The other thirteen .test.ts files
      # under _shared have never run in CI and two of them do not currently
      # type-check; running the directory would make this step permanently red,
      # which the header of this file explains is the same as having no guard.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Xero reverse-charge tax type
        run: npm run check:xero-drc

      # Green from the start, so enforced. ELE-1750: Minor Works had no way to
      # open the finished PDF at all — `CertShellFooter` offers Preview AND
      # View PDF, and this certificate's own footer only ever had Preview, so
      # the customer's document could not be seen from the form. Adding the
      # button put FIVE `flex-1` actions on one row, which at 390px is 65px
      # each with the labels clipped: a footer that fails nothing and cannot be
      # used. tsc, eslint and the dev server are all silent on that.
      #
      # So the harness asserts GEOMETRY at real phone widths — every action
      # present, none under 44px, nothing past the viewport edge — plus the
      # `text-white` rule from CLAUDE.md, which no linter can see because
      # `text-white/80` is a perfectly valid class. Both assertions were
      # verified by injecting the regression and watching them fail.
      #
      # It needs the Setup Deno step's sibling: Playwright's browser. Chrome is
      # already on the runner image, so `channel: 'chrome'` picks it up, and
      # the check skips rather than fails if neither is available.
      - name: Minor Works Sign off footer survives a phone
        run: npm run check:mw-footer

      # Green from the start, so enforced. The Elec-AI welcome screen has two
      # states and the wrong one is invisible to every other tool. The one-line
      # explanation and the four "Try asking" cards are onboarding — worth
      # ~400px of a phone exactly once. For a returning user they are furniture
      # between them and the composer, and they push that user's own
      # conversations below the fold.
      #
      # The `loading` case is not padding: without the sessionsLoading gate the
      # first-run layout draws while history is in flight, so a returning user
      # watches four cards appear and vanish EVERY time they open Elec-AI.
      # Nothing in tsc or eslint can tell you which layout rendered.
      - name: Elec-AI welcome screen shows the right state
        run: npm run check:elec-ai-welcome

      # Green from the start, so enforced. ELE-1752: the Elec-AI message
      # composer vanished whenever an announcement banner was live. Layout
      # renders banners ABOVE the routed page, and `.h-app-shell` subtracted
      # only the header — so a banner pushed an equal number of pixels off the
      # bottom, where the composer sits, and the shell does not scroll. It was
      # reported as an image-upload fault because the + button goes with the
      # composer.
      #
      # A CSS calc that is one term short is invisible to tsc and eslint, and
      # reasoning about the calc is what produced the bug. This measures the
      # composer against the viewport at four banner heights; reverting the fix
      # reproduces the original failure exactly, 84px of banner putting the
      # composer 84px past the fold.
      - name: App shell leaves room for the banners
        run: npm run check:app-shell

      # Green from the start, so enforced. ELE-1748: Anthropic is ~£1,224 a
      # month, 65% of the business's running costs, and not one token of it was
      # recorded anywhere — so no reduction could be anything but guesswork.
      # The four token counts are now stored verbatim from Anthropic; cost_usd
      # is DERIVED, and the derived half is the half that can be silently
      # wrong. A misplaced cache multiplier produces a plausible number nobody
      # questions until it is used to make a decision about the bill.
      #
      # The cache assertions matter most: a read is a tenth of a fresh input
      # token and a write is a quarter MORE than one. Get that backwards and
      # prompt caching looks like it saves nothing, and someone removes it.
      - name: AI cost arithmetic
        run: npm run check:ai-cost

      # Green from the start, so enforced. A reconciliation on 20 Sep 2026
      # found SIXTEEN functions live in production with no source in the repo —
      # including `stripe-webhook`, and `text-to-speech` and
      # `scan-inspection-photo`, both of which the app calls on a user's behalf.
      #
      # Code in that state is invisible to lint, typecheck, CI, review, git
      # history and blame, and a redeploy from a clean checkout erases it.
      # `lti-deep-link` is what it costs: eight months deployed carrying an
      # unsigned `{"alg":"none"}` JWT path that was not a fallback but the only
      # path, because the condition guarding the real branch tested a column
      # that does not exist. No reviewer could have caught it.
      #
      # Checks one direction only — deployed must exist in the repo. More in
      # the repo than deployed is normal. Skips where the Supabase CLI or a
      # token is unavailable rather than failing the build.
      - name: Every deployed edge function is in the repo
        run: npm run check:fns-versioned

      # Advisory ONLY because it is currently red: four general-upskilling mock
      # exam banks report CHANGED KEYS against HEAD (asbestos, first aid, MEWP,
      # PASMA). Those banks are graded against their keys, so this needs a
      # deliberate look rather than a rubber stamp. Drop continue-on-error the
      # moment it passes.
      - name: Key integrity
        run: npm run check:key-integrity
        continue-on-error: true
